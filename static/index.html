<!-- static/index.html -->
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <!-- Инструкция мобильным браузерам отображать страницу корректно под размер экрана -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram ToDo App</title>

    <!-- ⚠️ ВАЖНО: Официальный SDK Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* Стилизуем интерфейс с использованием Telegram CSS Переменных */
        /* Telegram сам подставляет var(--tg-theme-...) под тему пользователя (dark/light) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            padding: 16px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .task-item.completed {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .badge {
            background: #e74c3c;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <h2>📝 Мой ToDo Список</h2>

    <!-- Форма создания задачи -->
    <div class="card">
        <div class="form-group">
            <label>Что нужно сделать?</label>
            <input type="text" id="taskTitle" placeholder="Например: Купить молоко">
        </div>
        <div class="form-group">
            <label>Дедлайн (Время HH:MM)</label>
            <input type="time" id="taskDeadline">
        </div>
        <button onclick="addTask()">Добавить задачу</button>
    </div>

    <!-- Список сохраненных задач -->
    <div class="card">
        <h3>Задачи на сегодня</h3>
        <div id="taskList">Загрузка...</div>
    </div>

    <script>
        // Инициализируем объект Telegram WebApp SDK
        const tg = window.Telegram.WebApp;

        // Разворачиваем окно Mini App на всю высоту экрана
        tg.expand();

        // Извлекаем Telegram Chat ID пользователя!
        // Если открыто вне Telegram (для тестов в обычном браузере) — ставим тестовый ID
        const userChatId = tg.initDataUnsafe?.user?.id || 123456789;

        // Функция получения списка задач с бэкенда
        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks');
                const tasks = await response.json();

                const listContainer = document.getElementById('taskList');
                listContainer.innerHTML = ''; // Очищаем контейнер перед перерисовкой
                if (tasks.length === 0) {
                    listContainer.innerHTML = '<p style="opacity: 0.6;">Задач пока нет!</p>';
                    return;
                }

                // Отображаем каждую задачу
                tasks.forEach(task => {
                    const item = document.createElement('div');
                    item.className = `task-item ${task.completed ? 'completed' : ''}`;

                    item.innerHTML = `
                        <div>
                            <strong>${task.title}</strong>
                            <div style="font-size:12px; opacity:0.7;">⏰ ${task.deadline}</div>
                        </div>
                        <div>
                            ${!task.completed ? <button style="width:auto; padding:6px 12px;" onclick="completeTask(${task.id})">✓ Done</button> : '<span>Готово</span>'}
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            } catch (e) {
                console.error("Ошибка загрузки задач:", e);
            }
        }

        // Функция отправки новой задачи на FastAPI сервер
        async function addTask() {
            const title = document.getElementById('taskTitle').value;
            const deadline = document.getElementById('taskDeadline').value;

            if (!title || !deadline) {
                tg.showAlert("Заполните оба поля!");
                return;
            }

            // Отправляем POST запрос с JSON телом
            const res = await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: title,
                    deadline: deadline,
                    chat_id: userChatId // Передаем полученный Chat ID
                })
            });

            if (res.ok) {
                // Очищаем инпуты
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskDeadline').value = '';
                // Перерисовываем список
                loadTasks();
            }
        }


        async function completeTask(id) {
            await fetch(`/api/tasks/${id}/complete`, { method: 'POST' });
            loadTasks();
        }

        loadTasks();
    </script>
</body>

</html>
