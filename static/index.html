<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telegram ToDo App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            padding: 16px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 0;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;

            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);

            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;

            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);

            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;

            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-weight: bold;
            word-break: break-word;
        }

        .task-deadline {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .done-button {
            width: auto;
            padding: 6px 12px;
            font-size: 14px;
            flex-shrink: 0;
        }

        .completed {
            opacity: 0.5;
        }

        .completed .task-title {
            text-decoration: line-through;
        }

        .empty {
            text-align: center;
            opacity: 0.6;
        }

        .error {
            color: #e74c3c;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>📝 Мой ToDo Список</h2>

    <!-- Создание задачи -->
    <div class="card">

        <div class="form-group">
            <label for="taskTitle">Что нужно сделать?</label>

            <input
                type="text"
                id="taskTitle"
                placeholder="Например: Купить молоко"
            >
        </div>

        <div class="form-group">
            <label for="taskDeadline">Дедлайн</label>

            <input
                type="time"
                id="taskDeadline"
            >
        </div>

        <button id="addButton" onclick="addTask()">
            Добавить задачу
        </button>

    </div>


    <!-- Список задач -->
    <div class="card">

        <h3>Задачи на сегодня</h3>

        <div id="taskList">
            Загрузка...
        </div>

    </div>


    <script>

        // Telegram WebApp
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        // ID пользователя Telegram
        const userChatId =
            tg.initDataUnsafe?.user?.id || 123456789;


        // =========================
        // Загрузка задач
        // =========================

        async function loadTasks() {

            const listContainer =
                document.getElementById("taskList");

            try {

                const response = await fetch("/api/tasks");

                if (!response.ok) {
                    throw new Error(
                        `HTTP ошибка: ${response.status}`
                    );
                }

                const tasks = await response.json();

                listContainer.innerHTML = "";


                if (tasks.length === 0) {

                    listContainer.innerHTML =
                        '<p class="empty">Задач пока нет!</p>';

                    return;
                }


                tasks.forEach(task => {

                    const item =
                        document.createElement("div");


                    item.className =
                        `task-item ${
                            task.completed ? "completed" : ""
                        }`;


                    const info =
                        document.createElement("div");

                    info.className = "task-info";


                    info.innerHTML = `
                        <div class="task-title">
                            ${escapeHtml(task.title)}
                        </div>

                        <div class="task-deadline">
                            ⏰ ${escapeHtml(task.deadline)}
                        </div>
                    `;


                    item.appendChild(info);


                    // Если задача не выполнена
                    if (!task.completed) {

                        const button =
                            document.createElement("button");

                        button.className =
                            "done-button";

                        button.textContent =
                            "✓ Готово";

                        button.onclick = () =>
                            completeTask(task.id);

                        item.appendChild(button);

                    } else {

                        const done =
                            document.createElement("span");

                        done.textContent =
                            "Готово";

                        item.appendChild(done);
                    }


                    listContainer.appendChild(item);

                });


            } catch (error) {

                console.error(
                    "Ошибка загрузки задач:",
                    error
                );

                listContainer.innerHTML =
                    '<p class="error">Не удалось загрузить задачи</p>';
            }
        }


        // =========================
        // Добавление задачи
        // =========================

        async function addTask() {

            const titleInput =
                document.getElementById("taskTitle");

            const deadlineInput =
                document.getElementById("taskDeadline");

            const addButton =
                document.getElementById("addButton");


            const title =
                titleInput.value.trim();

            const deadline =
                deadlineInput.value;


            if (!title || !deadline) {

                tg.showAlert(
                    "Заполните название и дедлайн!"
                );

                return;
            }


            addButton.disabled = true;
            addButton.textContent = "Добавление...";


            try {

                const response = await fetch(
                    "/api/tasks",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            title: title,
                            deadline: deadline,
                            chat_id: userChatId
                        })
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Не удалось создать задачу"
                    );
                }


                // Очищаем поля
                titleInput.value = "";
                deadlineInput.value = "";


                // Обновляем список
                await loadTasks();


                tg.showAlert(
                    "Задача добавлена! ✅"
                );


            } catch (error) {

                console.error(
                    "Ошибка добавления:",
                    error
                );

                tg.showAlert(
                    "Ошибка: " + error.message
                );

            } finally {

                addButton.disabled = false;
                addButton.textContent =
                    "Добавить задачу";
            }
        }


        // =========================
        // Выполнение задачи
        // =========================

        async function completeTask(id) {

            try {

                const response = await fetch(
                    `/api/tasks/${id}/complete`,
                    {
                        method: "POST"
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Не удалось выполнить задачу"
                    );
                }


                await loadTasks();


            } catch (error) {

                console.error(
                    "Ошибка выполнения:",
                    error
                );

                tg.showAlert(
                    "Ошибка: " + error.message
                );
            }
        }


        // =========================
        // Защита текста
        // =========================

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }


        // Загружаем задачи при открытии
        loadTasks();

    </script>

</body>

</html>
